id = "local.claude-accounts"
name = "Claude Accounts"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Independent Claude account profiles, sign-in health and active sessions"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Claude Accounts: manage accounts"
contexts = ["workspace"]
command = ["python3", "manager.py", "open-ui"]

[[panes]]
id = "accounts"
title = "Claude Accounts"
placement = "overlay"
command = ["python3", "manager.py", "ui"]
